---
- name: Triển khai dự án bằng Ansible
  hosts: "{{ target_env }}"
  become: yes

  vars:
    deploy_dir: "/home/ubuntu/michinhhang"

  tasks:
    - name: Gỡ bỏ Docker bản cũ (nếu có) để tránh xung đột
      apt:
        name:
          - docker.io
          - docker-compose
        state: absent

    - name: Cài đặt Docker bản mới nhất chính chủ
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/libexec/docker/cli-plugins/docker-compose

    - name: Cấp quyền sử dụng Docker cho user ubuntu
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Cấp quyền và khởi tạo thư mục dự án
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: ubuntu
        group: www-data
        mode: '0775'

    - name: Đồng bộ mã nguồn từ Jenkins sang Server đích
      synchronize:
        src: "./"
        dest: "{{ deploy_dir }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=wp-content/uploads/"

    - name: Thực thi Docker Compose (Cú pháp V2 mới nhất)
      shell: |
        docker compose build
        docker compose up -d --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
