---
- name: Cập nhật ứng dụng kiểu Rolling Update
  hosts: live
  become: yes
  serial: 1 # <--- ĐÂY LÀ CHÌA KHÓA: Chỉ làm 1 máy tại 1 thời điểm

  vars:
    deploy_dir: "/home/ubuntu/michinhhang"

  tasks:
    - name: Đồng bộ mã nguồn mới
      synchronize:
        src: "./"
        dest: "{{ deploy_dir }}/"
        rsync_opts:
          - "--exclude=.git"

    - name: Tạm dừng Load Balancer trỏ vào máy này (Nếu dùng HAProxy/Nginx)
      # Lệnh này sẽ rút máy hiện tại khỏi cụm cân bằng tải để khách không vào nữa
      command: echo "Đang rút máy {{ inventory_hostname }} khỏi Load Balancer..."

    - name: Thực thi Docker Compose (Code mới)
      shell: |
        docker compose build
        docker compose up -d --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"

    - name: Kiểm tra ứng dụng đã lên sóng chưa (Chờ HTTP 200 OK)
      uri:
        url: "http://localhost:80" # Đợi cho đến khi app trả về 200 mới đi tiếp
        status_code: 200
      register: result
      until: result.status == 200
      retries: 10
      delay: 5

    - name: Đưa máy này trở lại Load Balancer đón khách
      command: echo "Máy {{ inventory_hostname }} đã sẵn sàng phục vụ!"
