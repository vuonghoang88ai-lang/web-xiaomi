services:
  # --- WORDPRESS STACK ---
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always

  wordpress:
    image: wordpress:php8.2-apache
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_REDIS_HOST', 'redis' );
        define( 'WP_REDIS_PORT', 6379 );
        $$protocol = (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') ? 'https://' : 'http://';
        if (isset($$_SERVER['HTTP_HOST'])) {
            define('WP_SITEURL', $$protocol . $$_SERVER['HTTP_HOST']);
            define('WP_HOME', $$protocol . $$_SERVER['HTTP_HOST']);
        }
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - ./wp-content:/var/www/html/wp-content
    depends_on:
      - db
      - redis

  # --- AUTONOMOUS MARKETING MULTI-AGENT ENGINE ---
  marketing-agent-engine:
    build:
      context: ./dify-integration/agent-engine
      dockerfile: Dockerfile
    container_name: michinhhang-marketing-agent-1
    restart: always
    env_file:
      - /home/ubuntu/michinhhang/dify-integration/.env
    ports:
      - "8085:8085"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./dify-integration/agent-engine:/app
      - ./wp-content:/home/ubuntu/michinhhang/wp-content
      - ./wp-content:/var/www/html/wp-content
      - ./dify-integration/autopilot/campaigns:/app/../autopilot/campaigns
    environment:
      - WP_CONTAINER_NAME=michinhhang-wordpress-1
      - ROUTER_URL=http://100.73.214.3:40128/v1/chat/completions
    depends_on:
      - wordpress
    networks:
      - default
      - dify_net

  # --- CLOUDFLARE TUNNEL (Bật khi cần expose, dùng biến CLOUDFLARE_TUNNEL_TOKEN trong .env) ---
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  # --- DIFY AI PORTAL ---
  # Dify chạy độc lập với docker-compose riêng tại: ./dify/docker/
  # Lệnh khởi động: cd dify/docker && docker compose up -d
  # Port mặc định: 80 (Nginx), API: 5001

volumes:
  db_data:

networks:
  default:
  dify_net:
    external: true
    name: docker_default
